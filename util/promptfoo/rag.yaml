# FINAL CORRECTED Configuration
# Proper Promptfoo variable access: context.vars.{varname}
# Your CSV has: question, answer, context

defaultTest:
  assert:
    # Primary: Better similarity model with lower threshold
    - type: similar
      threshold: 0.68
      value: "{{answer}}"
      provider: huggingface:sentence-similarity:sentence-transformers/paraphrase-multilingual-mpnet-base-v2
      weight: 0.5
    
    # Secondary: Verify correct legal act is cited
    - type: javascript
      value: |
        // Access the 'context' variable from your CSV
        const contextStr = context.vars.context || '';
        const outputStr = output || '';
        
        // Extract act number from context (e.g., "2025/102-SD")
        const actMatch = contextStr.match(/Act No\. ([\d\/\-A-Z]+)/);
        
        if (!actMatch) {
          return { 
            pass: true, 
            score: 1, 
            reason: "No specific act to verify" 
          };
        }
        
        const expectedAct = actMatch[1];
        const hasCitation = outputStr.includes(expectedAct);
        
        return {
          pass: hasCitation,
          score: hasCitation ? 1 : 0.3,
          reason: hasCitation 
            ? `✓ Correctly cites ${expectedAct}` 
            : `✗ Missing reference to ${expectedAct}`
        };
      weight: 0.3

    # Tertiary: Penalize "I don't know" responses
    - type: javascript
      value: |
        const outputStr = String(output || '').toLowerCase();
        const dontKnowPhrases = [
          "i don't know",
          "i do not know",
          "cannot find",
          "cannot determine",
          "no information",
          "not specified",
          "not available"
        ];
        
        const isVague = dontKnowPhrases.some(phrase => outputStr.includes(phrase));
        
        return {
          pass: !isVague,
          score: isVague ? 0 : 1,
          reason: isVague 
            ? "❌ Answer is too vague/non-committal" 
            : "✓ Answer is substantive"
        };
      weight: 0.2

